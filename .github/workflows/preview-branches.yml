name: Branch previews (GitHub Pages)

# Publishes every non-main branch to GitHub Pages under its own subpath:
#
#   https://<owner>.github.io/<repo>/<branch>/
#
# (characters other than letters, digits, ".", "_" and "-" become dashes, so
# `claude/foo` is served at `.../claude-foo/`). Several branches stay live side
# by side, and the root lists them. Production still deploys to Cloudflare;
# this is preview-only.
#
# How: each branch's build is committed into its own directory on the
# gh-pages branch, which only stores the previews; the whole gh-pages tree is
# then deployed with actions/deploy-pages. Pages' source must be "GitHub
# Actions", and every branch to preview must be allowed in the github-pages
# environment's deployment branch rules (Settings → Environments →
# github-pages), e.g. with the pattern `claude/*`.
#
# Runs only in otteriman's repository: the upstream repo's github-pages
# environment allows main alone, which is why its earlier single-preview
# workflow was removed in 679f5d6.
on:
  push:
    branches-ignore: [main, gh-pages]
  delete:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Every run commits to the same gh-pages branch, so runs queue up rather than
# race; none is cancelled, or a branch's latest push could go unpublished.
concurrency:
  group: pages-branch-previews
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.repository_owner == 'otteriman' &&
      (github.event_name != 'delete' || github.event.ref_type == 'branch')
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      # On `delete`, GitHub runs this from the default branch, which is what
      # gets checked out; only scripts/preview-index.sh is needed then.
      - uses: actions/checkout@v4
      - id: slug
        env:
          BRANCH: ${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
        run: echo "slug=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'delete'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - if: github.event_name != 'delete'
        run: npm ci
      # BASE_PATH (read in astro.config.mjs) makes every internal link and
      # asset URL resolve under this branch's subpath.
      - if: github.event_name != 'delete'
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/${{ steps.slug.outputs.slug }}
      - name: Update the branch's directory on gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.slug.outputs.slug }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          pages="$RUNNER_TEMP/pages"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$url" "$pages"
          else
            git init -b gh-pages "$pages"
            git -C "$pages" remote add origin "$url"
          fi
          rm -rf "${pages:?}/$SLUG"
          if [ "$EVENT" != delete ]; then cp -R dist "$pages/$SLUG"; fi
          cd "$pages"
          bash "$GITHUB_WORKSPACE/scripts/preview-index.sh" > index.html
          # Astro emits an _astro/ directory, which Jekyll would drop.
          touch .nojekyll
          git add -A
          if git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "preview: ${EVENT} ${SLUG} @ ${GITHUB_SHA::7}"; then
            git push origin gh-pages
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}${{ github.event_name != 'delete' && format('{0}/', needs.update.outputs.slug) || '' }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
