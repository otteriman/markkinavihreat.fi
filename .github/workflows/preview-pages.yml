name: Preview (GitHub Pages)

# Publishes the latest non-main branch to GitHub Pages so changes can be
# reviewed before merging. This is separate from production, which deploys
# to Cloudflare (see `npm run deploy`) — GitHub Pages here is preview-only.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one preview can be live at a time; a newer push supersedes the
# in-progress deploy for an older one.
concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
          NOINDEX: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
